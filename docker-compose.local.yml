services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.local
    environment:
      FIZGIG_PROJECTS_ROOT: /workspace/projects
    volumes:
      - ./.local/workspace:/workspace
      - ./backend/app:/app/app
    ports:
      - "18000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.local
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
